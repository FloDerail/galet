# Flatpak manifest for Galet, as submitted to Flathub (builds from the git tag).
# Build and install locally:
#   flatpak install --user flathub org.flatpak.Builder org.gnome.Sdk//51
#   flatpak run org.flatpak.Builder --user --install --force-clean build-dir flatpak/flathub/io.github.FloDerail.Galet.yml
id: io.github.FloDerail.Galet
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: galet
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # A file manager needs to see your files and network shares
  - --filesystem=host
  - --filesystem=host-os:ro
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.gtk.vfs.*
  # Servers (SMB, SFTP, WebDAV…) and the optional local AI (Ollama on localhost)
  - --share=network
  # Quick Look (GNOME Sushi) and Send to Phone (Zorin Connect / GSConnect)
  - --talk-name=org.gnome.NautilusPreviewer
  - --talk-name=org.gnome.Shell.Extensions.ZorinConnect
  - --talk-name=org.gnome.Shell.Extensions.GSConnect
  # Answer "Show in folder" from other apps (VS Code, browsers…)
  - --own-name=org.freedesktop.FileManager1
  # Open a terminal, run thumbnailers, pdftotext and 7z from the host system
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: galet
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/galet
      - cp -r galet po data bin /app/share/galet/
      - install -Dm755 flatpak/galet.sh /app/bin/galet
      - sed 's|@BIN@|galet|' data/io.github.FloDerail.Galet.desktop.in > io.github.FloDerail.Galet.desktop
      - install -Dm644 io.github.FloDerail.Galet.desktop -t /app/share/applications
      - install -Dm644 data/io.github.FloDerail.Galet.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.FloDerail.Galet.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.FloDerail.Galet-symbolic.svg -t /app/share/icons/hicolor/symbolic/apps
    sources:
      - type: git
        url: https://github.com/FloDerail/galet.git
        tag: v0.7.0
        commit: b9e7476b275d94578d87ff8bee1e0329bed4c5c7
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
